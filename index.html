<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Escudo de Salud de Doña Mari - Semana 5</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 16px; box-sizing: border-box; }
        .hidden { display: none !important; }
        .bloque-tarjeta { background-color: white; border-radius: 24px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; border: 1px solid #e5e7eb; box-sizing: border-box; }
        .text-center { text-align: center; }
        .mb-6 { margin-bottom: 24px; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .badge { background-color: #d1fae5; color: #065f46; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 9999px; text-transform: uppercase; display: inline-block; }
        h1 { font-size: 24px; font-weight: bold; color: #111827; margin: 8px 0 0 0; }
        .text-sm { font-size: 14px; color: #6b7280; }
        .text-base { font-size: 16px; font-weight: bold; color: #374151; }
        .flex-col { display: flex; flex-direction: column; gap: 4px; }
        .input-nombre { height: 48px; width: 100%; border: 1px solid #d1d5db; border-radius: 12px; padding: 0 16px; font-size: 18px; box-sizing: border-box; outline: none; }
        .btn-verde { background-color: #059669; color: white; font-weight: bold; width: 100%; height: 56px; border-radius: 12px; border: none; font-size: 18px; cursor: pointer; }
        .btn-verde:hover { background-color: #047857; }
        .alerta-instruccion { font-size: 14px; font-weight: 600; color: #047857; background-color: #ecfdf5; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .contenedor-grid { display: flex; gap: 8px; margin-top: 8px; }
        .btn-opcion { flex: 1; padding: 12px 4px; border: 1px solid #d1d5db; border-radius: 12px; background-color: white; text-align: center; font-size: 13px; font-weight: 500; color: #374151; cursor: pointer; }
        .btn-seleccionado { background-color: #059669 !important; color: white !important; border-color: #059669 !important; }
        .pre-json { background-color: #111827; padding: 16px; border-radius: 16px; border: 1px solid #1f2937; margin-bottom: 16px; overflow-x: auto; }
        .json-titulo { color: #9ca3af; font-size: 10px; font-weight: bold; display: block; margin-bottom: 8px; }
        .json-code { color: #34d399; font-family: monospace; font-size: 11px; margin: 0; white-space: pre-wrap; }
        .tarjeta-resultado { border: 1px solid #e5e7eb; padding: 20px; border-radius: 16px; background-color: white; }
        .lbl-riesgo { font-size: 14px; font-weight: bold; text-align: center; padding: 12px; border-radius: 12px; text-transform: uppercase; margin: 16px 0; }
        ul { padding-left: 20px; margin: 8px 0 0 0; font-size: 13px; color: #4b5563; list-style-type: disc; }
        li { margin-bottom: 4px; }
        .btn-reinicio { width: 100%; height: 48px; border-radius: 12px; background-color: #e5e7eb; color: #374151; font-weight: bold; font-size: 14px; border: none; cursor: pointer; margin-top: 16px; }
    </style>
</head>
<body>

    <div class="bloque-tarjeta">
        <div id="paso1">
            <div class="flex-col mb-4">
                <label class="text-base">¿Cuál es su nombre?</label>
                <input type="text" id="nombreInput" value="Doña Mari" class="input-nombre">
            </div>
            <button type="button" onclick="irAPaso2()" class="btn-verde">Iniciar Registro Diario</button>
        </div>

        <div id="paso2" class="hidden">
            <div class="alerta-instruccion">Doña Mari, seleccione las opciones de hoy:</div>
            <div class="mb-4">
                <label class="text-base">1. ¿Cuántas horas pasó de pie hoy?</label>
                <div class="contenedor-grid">
                    <button type="button" onclick="seleccionar('q1', 'A', this)" class="q1-btn btn-opcion">Menos de 6h</button>
                    <button type="button" onclick="seleccionar('q1', 'B', this)" class="q1-btn btn-opcion">De 6 a 10h</button>
                    <button type="button" onclick="seleccionar('q1', 'C', this)" class="q1-btn btn-opcion">Más de 10h</button>
                </div>
            </div>
            <div class="mb-4">
                <label class="text-base">2. ¿Qué nivel de dolor siente en sus piernas?</label>
                <div class="contenedor-grid">
                    <button type="button" onclick="seleccionar('q2', 'A', this)" class="q2-btn btn-opcion">Leve / Ninguno</button>
                    <button type="button" onclick="seleccionar('q2', 'B', this)" class="q2-btn btn-opcion">Moderado</button>
                    <button type="button" onclick="seleccionar('q2', 'C', this)" class="q2-btn btn-opcion">Intenso</button>
                </div>
            </div>
            <div class="mb-4">
                <label class="text-base">3. ¿Estuvo expuesta a humo o calor intenso?</label>
                <div class="contenedor-grid">
                    <button type="button" onclick="seleccionar('q3', 'A', this)" class="q3-btn btn-opcion">No / Muy poco</button>
                    <button type="button" onclick="seleccionar('q3', 'B', this)" class="q3-btn btn-opcion">Sí, gran día</button>
                </div>
            </div>
            <button type="button" onclick="evaluarRespuestas()" class="btn-verde mt-4">Procesar Reporte de Salud</button>
        </div>

        <div id="paso3" class="hidden">
            <div class="pre-json">
                <span class="json-titulo">NÚCLEO TECNOLÓGICO: LLM STRUCTURED OUTPUT</span>
                <pre id="jsonBlock" class="json-code"></pre>
            </div>
            <div id="tarjetaRiesgo" class="tarjeta-resultado">
                <h2>Constancia de Monitoreo</h2>
                <p class="text-sm">Avalado para: <strong id="lblNombre"></strong></p>
                <p style="font-size:12px;">Ergonomía: <strong id="valErgo"></strong> | Térmica: <strong id="valTermica"></strong></p>
                <p id="lblRiesgo" class="lbl-riesgo"></p>
                <ul id="listaRecomendaciones"></ul>
            </div>
            <button type="button" onclick="reiniciar()" class="btn-reinicio">Registrar nueva jornada</button>
        </div>
    </div>

    <!-- Vinculación directa al archivo de lógica independiente -->
    <script src="script.js"></script>
</body>
</html>
